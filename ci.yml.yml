name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Backend: lint + tests (skipped only while backend/package.json does not exist yet)
      - name: Backend install
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm ci

      - name: Backend lint
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm run lint

      - name: Backend test
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm test

      # Frontend: lint + build (skipped only while frontend/package.json does not exist yet)
      - name: Frontend install
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build
